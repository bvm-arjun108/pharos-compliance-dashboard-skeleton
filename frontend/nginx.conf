# Baked into the frontend Docker image (see frontend/Dockerfile). Functionally the same as
# deploy/nginx/pharos-dashboard.conf, used when nginx is installed directly on an EC2 host instead
# -- the difference is the backend's address. The backend still runs directly on the host (not
# containerized here yet), so this container reaches it via `host.docker.internal`, which resolves
# to the host machine from inside a container. That works
# out of the box on Docker Desktop; on plain Linux Docker Engine (e.g. EC2) it needs the
# `extra_hosts: ["host.docker.internal:host-gateway"]` entry already present on the frontend
# service in docker-compose.yml. Static files are baked into this image at /usr/share/nginx/html
# by the Dockerfile's build stage, so there's no host path to point at for those.

# Query strings on this app carry customer-linkable data: /api/v1/transactions/detail takes an
# `identifier` and a `recordKey` (which embeds report group, batch and identifier) on every row
# expand, the list endpoints take `search`, which is typically an MTCN, and the SPA's own URLs
# carry the same values so they show up in Referer too. nginx's default `combined` format logs
# "$request" verbatim, which would persist all of it to the access log -- the same exposure that
# made SQL_LOG_LEVEL default to OFF, one layer up and just as durable once it reaches
# CloudWatch. Log the path without the query, and drop Referer for the same reason. Method,
# status, size and timing -- everything operationally useful -- are unaffected.
log_format pharos_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '$request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log pharos_no_query;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same three prefixes frontend/proxy.conf.json forwards in local dev, and
    # deploy/nginx/pharos-dashboard.conf forwards on a bare EC2 host.
    location /api/ {
        proxy_pass http://host.docker.internal:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://host.docker.internal:8085;
        proxy_set_header Host $host;
    }

    # Prefix match, not exact -- the dashboard split into /dashboardDetails/batch-view and
    # /dashboardDetails/transaction-view (see DashboardApi), and an `=` exact-match location here
    # would only ever match the old bare path, which no longer exists. Anything unmatched falls
    # through to the SPA fallback below, which serves index.html instead of proxying -- exactly
    # what broke both dashboard tiles when this was still `location = /dashboardDetails`.
    location /dashboardDetails/ {
        proxy_pass http://host.docker.internal:8085;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback: client-side Angular routing has no matching file on disk -- fall back to
    # index.html and let the Angular router take over, so a deep link or a refresh doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
