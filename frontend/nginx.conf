# Baked into the frontend Docker image (see frontend/Dockerfile). Functionally the same as
# deploy/nginx/pharos-dashboard.conf, used when nginx is installed directly on an EC2 host instead
# -- the difference is the backend's address. The backend still runs directly on the host (not
# containerized -- its build needs a live, schema-populated Postgres reachable at build time for
# jOOQ codegen, which a hermetic Docker build stage doesn't have), so this container reaches it via
# `host.docker.internal`, which resolves to the host machine from inside a container. That works
# out of the box on Docker Desktop; on plain Linux Docker Engine (e.g. EC2) it needs the
# `extra_hosts: ["host.docker.internal:host-gateway"]` entry already present on the frontend
# service in docker-compose.yml. Static files are baked into this image at /usr/share/nginx/html
# by the Dockerfile's build stage, so there's no host path to point at for those.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same three prefixes frontend/proxy.conf.json forwards in local dev, and
    # deploy/nginx/pharos-dashboard.conf forwards on a bare EC2 host.
    location /api/ {
        proxy_pass http://host.docker.internal:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://host.docker.internal:8085;
        proxy_set_header Host $host;
    }

    location = /dashboardDetails {
        proxy_pass http://host.docker.internal:8085;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback: client-side Angular routing has no matching file on disk -- fall back to
    # index.html and let the Angular router take over, so a deep link or a refresh doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
