sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/node_modules/**,src/environments/**,src/main.ts,src/index.html,src/favicon.ico
sonar.test.inclusions=**/*.spec.ts
sonar.typescript.lcov.reportPaths=coverage/dashboard/lcov.info
sonar.javascript.lcov.reportPaths=coverage/dashboard/lcov.info
sonar.testExecutionReportPaths=reports/test-reporter.xml
sonar.genericcoverage.unitTestReportPaths=reports/test-reporter.xml
