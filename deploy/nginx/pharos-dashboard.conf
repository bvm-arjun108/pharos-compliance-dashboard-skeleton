# Nginx server block for the Pharos Compliance Dashboard.
#
# Replaces exposing `ng serve` directly to the internet (the approach in AWS_POC_DEPLOYMENT.md).
# This serves the Angular production build (`ng build` output, static files -- no live Node
# process, no dev-server host/allowedHosts restrictions) and reverse-proxies API calls to the
# Spring Boot backend, which stays bound to loopback/private and is never exposed directly.
#
# One-time setup on the EC2 instance:
#   sudo dnf install -y nginx
#   sudo cp deploy/nginx/pharos-dashboard.conf /etc/nginx/conf.d/pharos-dashboard.conf
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# Security group change needed: open port 80 (HTTP) to whichever source IPs should reach the
# dashboard, matching how AWS_POC_DEPLOYMENT.md's section 3.5 opened port 4200. Port 4200 (Angular
# dev server) and 8085 (Spring Boot) no longer need to be reachable from outside the instance at
# all once this is in place -- only nginx on port 80 does.
#
# ROOT_PATH below must point at the built frontend's `browser/` output directory (see
# deploy/build.sh) -- update it if the project lives somewhere other than
# /opt/pharos-poc/pharos-compliance-dashboard-skeleton on this instance.

# Query strings on this app carry customer-linkable data: /api/v1/transactions/detail takes an
# `identifier` and a `recordKey` (which embeds report group, batch and identifier) on every row
# expand, the list endpoints take `search`, which is typically an MTCN, and the SPA's own URLs
# carry the same values so they show up in Referer too. nginx's default `combined` format logs
# "$request" verbatim, which would persist all of it to the access log -- the same exposure that
# made SQL_LOG_LEVEL default to OFF, one layer up and just as durable once it reaches
# CloudWatch. Log the path without the query, and drop Referer for the same reason. Method,
# status, size and timing -- everything operationally useful -- are unaffected.
log_format pharos_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '$request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log pharos_no_query;

    root "/opt/pharos-poc/pharos-compliance-dashboard-skeleton/frontend/dist/dashboard/browser";
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend reverse proxy -- the exact same three prefixes frontend/proxy.conf.json forwards in
    # local dev (see frontend/src/app for the only client-side fetch paths: /api/v1/batches,
    # /api/v1/report-configs, /api/v1/transactions/*, /dashboardDetails/*). No URI segment after
    # the upstream host in proxy_pass, so nginx forwards the original path and query string
    # unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
    }

    # Prefix match, not exact -- the dashboard split into /dashboardDetails/batch-view and
    # /dashboardDetails/transaction-view (see DashboardApi), and an `=` exact-match location here
    # would only ever match the old bare path, which no longer exists. Anything unmatched falls
    # through to the SPA fallback below, which serves index.html instead of proxying -- exactly
    # what broke both dashboard tiles when this was still `location = /dashboardDetails`.
    location /dashboardDetails/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
    }

    # Angular build output has no cache-busting hashes in its filenames (main.js, styles.css), so
    # cache lightly rather than aggressively -- a long max-age would serve stale JS after the next
    # deploy until the cache expires.
    location ~* \.(?:js|css|ico)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback: client-side Angular routing (/batches, /batches/explorer, /transactions, ...)
    # has no matching file on disk -- always fall back to index.html and let the Angular router
    # take over, so a direct link or a browser refresh on a deep route doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
