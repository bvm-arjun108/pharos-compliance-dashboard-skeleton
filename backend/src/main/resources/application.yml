spring:
  application:
    name: pharos-compliance-dashboard
  main:
    banner-mode: off
    keep-alive: true
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

common:
  postgres:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/pharosRBT}
    driver: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USER:pharosRBT}
    password: ${DB_PASSWORD:pharosRBT}
    connectionTimeout: ${DB_CONNECTION_TIMEOUT:120000}
    maximumPoolSize: ${DB_MAX_POOL_SIZE:10}
    minimumIdle: ${DB_MIN_IDLE:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

server:
  port: 8085
  shutdown: graceful

pharos:
  observability:
    query-performance:
      enabled: ${QUERY_PERFORMANCE_LOG_ENABLED:true}
      slow-query-threshold: ${QUERY_SLOW_THRESHOLD:250ms}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    doc-expansion: none
    operations-sorter: method
    tags-sorter: alpha

logging:
  include-application-name: false
  level:
    com.pharos.compliance: INFO
    # DEBUG includes SQL, inlined bind values, and complete fetched database rows as pretty JSON --
    # that row dump carries real party names, dates of birth, phone numbers and ID numbers, and it
    # is written on every page load whether or not anyone expands a row. Wherever logs are shipped
    # (a file on the host, CloudWatch) that becomes a second copy of customer PII outside the
    # database's access controls, so this defaults to OFF and must be opted into deliberately:
    # SQL_LOG_LEVEL=DEBUG for local debugging only, never as a deployed default.
    # Turning it off does not blind you operationally -- QueryPerformanceSummaryLogger still reports
    # which queries ran, how long each took, and which crossed the slow threshold, with no row data.
    com.pharos.compliance.common.jdbc.logging.TracingNamedParameterJdbcTemplate: ${SQL_LOG_LEVEL:OFF}
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.springframework.boot.actuate.endpoint.web.EndpointLinksResolver: WARN
    org.springframework.boot.web.embedded.tomcat.TomcatWebServer: WARN
    org.springframework.boot.web.servlet.context.ServletWebServerApplicationContext: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%replace([trace=%X{traceId} span=%X{spanId}] ){'\\[trace= span=\\] ',''}){faint}%clr(%logger{0}){cyan} %clr(—){faint} %msg%n%wEx"
