version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pharos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pharosRBT
      POSTGRES_PASSWORD: pharosRBT
      POSTGRES_DB: pharosRBT

    ports:
      - "5439:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
